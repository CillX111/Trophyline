name: Release

# Push a tag like v1.0.0 to build the standalone .exe and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build standalone exe (no .NET install needed)
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish -c Release -r win-x64 -o out `
            -p:SelfContained=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$version

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          **Download ``Trophyline.exe`` below** and double-click it. No install or .NET needed (Windows 10/11, 64-bit).

          The window opens and a tiny tracker starts in the background. To start the tracker with Windows and add a Start menu entry, run once:
          ``````
          Trophyline.exe --install
          ``````
          Windows SmartScreen may warn because the file isn't signed: click **More info → Run anyway**.
          "@
          gh release create "${{ github.ref_name }}" out/Trophyline.exe --title "Trophyline ${{ github.ref_name }}" --notes $notes
